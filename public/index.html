<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Studio</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #faf8f5; color: #222; }
  header { background: #2b2b2b; color: #fff; padding: 10px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 16px 0 0; }
  nav button, header .right button { background: none; border: 0; color: #ddd; font-size: 15px; cursor: pointer; padding: 6px 8px; }
  nav button.active { color: #fff; border-bottom: 2px solid #e8b04b; }
  .right { margin-left: auto; font-size: 14px; }
  main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e3ddd3; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .muted { color: #777; font-size: 14px; }
  .state { padding: 24px; text-align: center; color: #666; }
  .state.error { color: #a12; }
  .msg { padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; }
  .msg.err { background: #fde8e8; color: #8a1c1c; } .msg.ok { background: #e6f4ea; color: #1d5c2e; }
  form.card { display: grid; gap: 8px; }
  label { display: grid; gap: 3px; font-size: 14px; }
  input, select, textarea, button.act { font: inherit; padding: 6px 8px; }
  button.act { cursor: pointer; border: 1px solid #aaa; background: #fff; border-radius: 4px; margin-left: 6px; }
  button.primary { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
  button.danger { color: #a12; border-color: #a12; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #eee; }
  .badge.available, .badge.confirmed, .badge.accepted, .badge.placed { background: #dff3e4; }
  .badge.sold, .badge.declined, .badge.cancelled { background: #f6dede; }
  .badge.requested { background: #fff3cd; }
  h2 { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>Art Studio</h1>
  <nav id="nav"></nav>
  <div class="right" id="who"></div>
</header>
<main id="main"></main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '₹' + Number(n).toLocaleString('en-IN');
let me = null, config = null, tab = 'paintings', flash = null;

async function api(method, path, body) {
  const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && me) { me = null; render(); }
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
function setFlash(type, text) { flash = { type, text }; }
const flashHtml = () => { const f = flash; flash = null; return f ? `<div class="msg ${f.type}">${esc(f.text)}</div>` : ''; };

// Every data screen goes through here: loading -> (error | empty | content).
async function loadInto(el, fetcher, renderItem, emptyText) {
  el.innerHTML = '<div class="state">Loading…</div>';
  try {
    const items = await fetcher();
    el.innerHTML = items.length ? items.map(renderItem).join('') : `<div class="state">${esc(emptyText)}</div>`;
  } catch (e) {
    el.innerHTML = `<div class="state error">${esc(e.message)} <button class="act" data-retry>Retry</button></div>`;
    el.querySelector('[data-retry]').onclick = () => loadInto(el, fetcher, renderItem, emptyText);
  }
}
// Run an action, show its result/refusal in the banner, then refresh the tab.
async function act(fn, okText) {
  try { await fn(); setFlash('ok', okText); } catch (e) { setFlash('err', e.message); }
  show();
}
const bind = (root, sel, ev, fn) => root.querySelectorAll(sel).forEach((n) => n.addEventListener(ev, () => fn(n)));

// ---------- shell ----------
function render() {
  const nav = $('#nav'), who = $('#who');
  if (!me) { nav.innerHTML = ''; who.innerHTML = ''; return authView(); }
  const tabs = [['paintings', 'Paintings'], ['orders', 'Orders'], ['bookings', 'Wall bookings'], ['pottery', 'Pottery']];
  nav.innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${k === tab ? 'active' : ''}">${l}</button>`).join('');
  bind(nav, 'button', 'click', (b) => { tab = b.dataset.t; render(); });
  who.innerHTML = `${esc(me.name)} (${me.role}) <button id="out">Log out</button>`;
  $('#out').onclick = async () => { await api('POST', '/auth/logout').catch(() => {}); me = null; render(); };
  show();
}
function show() { ({ paintings: paintingsView, orders: ordersView, bookings: bookingsView, pottery: potteryView })[tab](); }

function authView() {
  $('#main').innerHTML = `${flashHtml()}
  <form class="card" id="login"><h2>Log in</h2>
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" required></label>
    <button class="act primary">Log in</button></form>
  <form class="card" id="signup"><h2>New customer? Sign up</h2>
    <label>Name<input name="name" required></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Password (min 6)<input name="password" type="password" minlength="6" required></label>
    <button class="act primary">Create account</button></form>`;
  for (const [id, path] of [['login', '/auth/login'], ['signup', '/auth/signup']]) {
    $('#' + id).onsubmit = async (e) => {
      e.preventDefault();
      try { me = await api('POST', path, Object.fromEntries(new FormData(e.target))); config = await api('GET', '/seed'); tab = 'paintings'; render(); }
      catch (err) { setFlash('err', err.message); authView(); }
    };
  }
}

// ---------- paintings ----------
function paintingsView() {
  const isAdmin = me.role === 'admin';
  $('#main').innerHTML = `${flashHtml()}<h2>Paintings</h2>
    ${isAdmin ? `<form class="card" id="pform"><b id="ptitle">Add a painting</b>
      <input type="hidden" name="id">
      <label>Title<input name="title" required></label>
      <label>Artist<input name="artist"></label>
      <label>Description<input name="description"></label>
      <label>Price (₹)<input name="price" type="number" min="1" step="1" required></label>
      <div><button class="act primary">Save</button><button type="button" class="act" id="pclear">Clear</button></div></form>` : ''}
    <div id="list"></div>`;
  const list = $('#list'); let cache = [];
  loadInto(list, async () => (cache = await api('GET', '/paintings')), (p) => `
    <div class="card row"><div><b>${esc(p.title)}</b> <span class="badge ${p.status}">${p.status}</span>
      <div class="muted">${esc(p.artist)} ${esc(p.description)}</div></div>
      <div>${money(p.price)}
      ${!isAdmin && p.status === 'available' ? `<button class="act primary" data-buy="${p.id}">Buy</button>` : ''}
      ${isAdmin && p.status === 'available' ? `<button class="act" data-edit="${p.id}">Edit</button>` : ''}</div></div>`,
    'No paintings yet.').then(() => {
    bind(list, '[data-buy]', 'click', (b) => act(() => api('POST', '/orders', { paintingId: Number(b.dataset.buy) }), 'Order placed.'));
    bind(list, '[data-edit]', 'click', (b) => {
      const p = cache.find((x) => x.id == b.dataset.edit), f = $('#pform');
      for (const k of ['id', 'title', 'artist', 'description', 'price']) f[k].value = p[k];
      $('#ptitle').textContent = 'Edit painting #' + p.id; f.scrollIntoView();
    });
  });
  if (isAdmin) {
    $('#pclear').onclick = () => { $('#pform').reset(); $('#pform').id.value = ''; $('#ptitle').textContent = 'Add a painting'; };
    $('#pform').onsubmit = (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target)), id = d.id; delete d.id;
      act(() => (id ? api('PUT', '/paintings/' + id, d) : api('POST', '/paintings', d)), id ? 'Painting updated.' : 'Painting added.');
    };
  }
}

// ---------- orders ----------
function ordersView() {
  const isAdmin = me.role === 'admin';
  $('#main').innerHTML = `${flashHtml()}<h2>${isAdmin ? 'All orders' : 'My orders'}</h2><div id="list"></div>`;
  loadInto($('#list'), () => api('GET', '/orders'), (o) => `
    <div class="card row"><div><b>${esc(o.painting_title)}</b> <span class="badge ${o.status}">${o.status}</span>
      <div class="muted">${isAdmin ? esc(o.customer_name) + ' · ' + esc(o.customer_email) + ' · ' : ''}${money(o.price)} · ${esc(o.created_at)}</div></div>
      <div>${!isAdmin && o.status === 'placed' ? `<button class="act danger" data-cancel="${o.id}">Cancel order</button>` : ''}</div></div>`,
    'No orders yet.').then(() =>
    bind($('#list'), '[data-cancel]', 'click', (b) => act(() => api('POST', `/orders/${b.dataset.cancel}/cancel`), 'Order cancelled.')));
}

// ---------- wall bookings ----------
const isoPlus = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function bookingsView() {
  const isAdmin = me.role === 'admin';
  $('#main').innerHTML = `${flashHtml()}<h2>Wall painting bookings</h2>
    ${isAdmin ? '' : `<form class="card" id="bform"><b>Book a date (7–90 days away, ₹${config.wallRatePerSqFt}/sq ft)</b>
      <label>Date<input name="date" type="date" min="${isoPlus(7)}" max="${isoPlus(90)}" required></label>
      <label>Wall size (10–500 sq ft)<input name="wallSqFt" type="number" min="10" max="500" step="1" required></label>
      <label>Address<textarea name="address" required minlength="5"></textarea></label>
      <div class="muted" id="quote"></div>
      <div><button class="act primary">Request booking</button></div>
      <div class="muted" id="taken"></div></form>`}
    <div id="list"></div>`;
  if (!isAdmin) {
    const f = $('#bform');
    f.wallSqFt.oninput = () => { $('#quote').textContent = f.wallSqFt.value ? 'Price: ' + money(f.wallSqFt.value * config.wallRatePerSqFt) : ''; };
    api('GET', '/bookings/taken-dates').then((d) => { $('#taken').textContent = d.length ? 'Already taken: ' + d.join(', ') : 'No dates taken yet.'; })
      .catch(() => { $('#taken').textContent = 'Could not load taken dates (the server will still check).'; });
    f.onsubmit = (e) => { e.preventDefault(); const d = Object.fromEntries(new FormData(f)); act(() => api('POST', '/bookings', d), 'Booking requested.'); };
  }
  loadInto($('#list'), () => api('GET', '/bookings'), (b) => `
    <div class="card row"><div><b>${esc(b.booking_date)}</b> <span class="badge ${b.status}">${b.status}</span>
      <div class="muted">${isAdmin ? esc(b.customer_name) + ' · ' : ''}${b.wall_sqft} sq ft · ${money(b.price)} · ${esc(b.address)}</div></div>
      <div>${isAdmin && b.status === 'requested' ? `<button class="act primary" data-ok="${b.id}">Confirm</button><button class="act danger" data-no="${b.id}">Decline</button>` : ''}
      ${!isAdmin && ['requested', 'confirmed'].includes(b.status) ? `<button class="act danger" data-cancel="${b.id}">Cancel</button>` : ''}</div></div>`,
    'No bookings yet.').then(() => {
    const L = $('#list');
    bind(L, '[data-ok]', 'click', (b) => act(() => api('POST', `/bookings/${b.dataset.ok}/confirm`), 'Booking confirmed.'));
    bind(L, '[data-no]', 'click', (b) => act(() => api('POST', `/bookings/${b.dataset.no}/decline`), 'Booking declined.'));
    bind(L, '[data-cancel]', 'click', (b) => act(() => api('POST', `/bookings/${b.dataset.cancel}/cancel`), 'Booking cancelled.'));
  });
}

// ---------- pottery ----------
function potteryView() {
  const isAdmin = me.role === 'admin'; let cache = [];
  const opts = (arr, sel) => arr.map((v) => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
  $('#main').innerHTML = `${flashHtml()}<h2>Custom pottery</h2>
    ${isAdmin ? '' : `<form class="card" id="pform"><b id="ptitle">Request pottery</b><input type="hidden" name="id">
      <label>Item<select name="item">${config.potteryItems.map((i) => `<option value="${esc(i.name)}">${esc(i.name)} (${money(i.price)} each)</option>`).join('')}</select></label>
      <label>Glaze<select name="glaze">${opts(config.glazes)}</select></label>
      <label>Quantity (1–12)<input name="quantity" type="number" min="1" max="12" step="1" value="1" required></label>
      <label>Needed by (at least 14 days away)<input name="neededBy" type="date" min="${isoPlus(14)}" required></label>
      <div><button class="act primary">Save request</button><button type="button" class="act" id="pclear">Clear</button></div></form>`}
    <div id="list"></div>`;
  if (!isAdmin) {
    const f = $('#pform');
    $('#pclear').onclick = () => { f.reset(); f.id.value = ''; $('#ptitle').textContent = 'Request pottery'; };
    f.onsubmit = (e) => {
      e.preventDefault(); const d = Object.fromEntries(new FormData(f)), id = d.id; delete d.id;
      act(() => (id ? api('PUT', '/pottery/' + id, d) : api('POST', '/pottery', d)), id ? 'Request updated.' : 'Request sent.');
    };
  }
  loadInto($('#list'), async () => (cache = await api('GET', '/pottery')), (r) => `
    <div class="card row"><div><b>${r.quantity} × ${esc(r.item)}</b>, ${esc(r.glaze)} <span class="badge ${r.status}">${r.status}</span>
      <div class="muted">${isAdmin ? esc(r.customer_name) + ' · ' : ''}needed by ${esc(r.needed_by)} · ${money(r.price)}</div></div>
      <div>${isAdmin && r.status === 'requested' ? `<button class="act primary" data-ok="${r.id}">Accept</button><button class="act danger" data-no="${r.id}">Decline</button>` : ''}
      ${!isAdmin && r.status === 'requested' ? `<button class="act" data-edit="${r.id}">Edit</button><button class="act danger" data-cancel="${r.id}">Cancel</button>` : ''}</div></div>`,
    'No pottery requests yet.').then(() => {
    const L = $('#list');
    bind(L, '[data-ok]', 'click', (b) => act(() => api('POST', `/pottery/${b.dataset.ok}/accept`), 'Request accepted.'));
    bind(L, '[data-no]', 'click', (b) => act(() => api('POST', `/pottery/${b.dataset.no}/decline`), 'Request declined.'));
    bind(L, '[data-cancel]', 'click', (b) => act(() => api('POST', `/pottery/${b.dataset.cancel}/cancel`), 'Request cancelled.'));
    bind(L, '[data-edit]', 'click', (b) => {
      const r = cache.find((x) => x.id == b.dataset.edit), f = $('#pform');
      f.id.value = r.id; f.item.value = r.item; f.glaze.value = r.glaze; f.quantity.value = r.quantity; f.neededBy.value = r.needed_by;
      $('#ptitle').textContent = 'Edit request #' + r.id; f.scrollIntoView();
    });
  });
}

// ---------- boot ----------
(async () => {
  $('#main').innerHTML = '<div class="state">Loading…</div>';
  try { me = await api('GET', '/me'); config = await api('GET', '/seed'); } catch { me = null; }
  render();
})();
</script>
</body>
</html>
